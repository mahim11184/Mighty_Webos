<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iOS Web OS - Final Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body onload="initOS()">

  <!-- Loading / Splash Screen -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p id="loadingText" style="font-weight: 600; font-size: 15px;">Starting Web OS...</p>
  </div>

  <!-- Pullable Notification & Control Center Panel -->
  <div class="notification-panel" id="notificationPanel" onclick="toggleNotificationPanel()">
    <div class="notif-header">Control Center & Notifications</div>
    <div class="quick-toggles">
      <div class="toggle-btn active" onclick="event.stopPropagation()">📶 <span>WiFi</span></div>
      <div class="toggle-btn active" onclick="event.stopPropagation()">🔵 <span>Bluetooth</span></div>
      <div class="toggle-btn" onclick="event.stopPropagation()">🌙 <span>DND</span></div>
      <div class="toggle-btn active" onclick="event.stopPropagation()">🔆 <span>Auto</span></div>
    </div>
    <div class="notif-card"><strong>System Security</strong><br>Permanent storage layer active.</div>
    <div class="pull-handle"></div>
  </div>

  <!-- iOS Status Bar -->
  <div class="status-bar" onclick="toggleNotificationPanel()">
    <span id="clock">12:00</span>
    <span>Web OS 🌙 100% 🔋</span>
  </div>

  <!-- App Grid (Desktop) -->
  <div class="app-grid" id="appGrid">
    <div class="app-icon" onclick="document.getElementById('zipInput').click()">
      <img src="assets/icons/install.png" alt="Install">
      <span>Install App</span>
    </div>
  </div>

  <!-- iOS Dock -->
  <div class="dock">
    <div class="app-icon" onclick="openSettings()">
      <img src="assets/icons/settings.png" alt="Settings">
      <span style="color:white; font-size:11px;">Settings</span>
    </div>
  </div>

  <!-- App Window Modal -->
  <div class="app-window" id="appWindow">
    <div class="app-header">
      <button class="close-btn" onclick="closeApp()"></button>
      <span id="appTitle" style="font-weight:600; font-size:14px;">App Title</span>
      <div style="width: 14px;"></div>
    </div>
    <div id="windowBody" style="flex:1; display:flex; flex-direction:column;">
      <iframe id="appIframe"></iframe>
    </div>
  </div>

  <!-- Hidden File Inputs -->
  <input type="file" id="zipInput" accept=".zip" onchange="handleZipUpload(event)">
  <input type="file" id="restoreInput" accept=".json" onchange="importBackup(event)" style="display:none;">

  <script src="js/os.js"></script>
</body>
    </html>
